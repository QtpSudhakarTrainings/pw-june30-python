[project]
name = "pw-june30-python"
version = "1.0.0"
description = "Python port (pytest + tamash-playwright) of the pw-june30 TypeScript Playwright course suite."
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.5.0",
    "pytest-html>=4.1.0",
    "tamash-playwright>=0.2.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
addopts = "--html=report.html --self-contained-html --tamash-report=tamash-report.html"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
